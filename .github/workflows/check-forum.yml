name: Check SCELE Forum

on:
  schedule:
    - cron: "0 * * * *"  # jalan tiap 1 jam, di menit ke-0
  workflow_dispatch:      # biar bisa dijalanin manual juga dari tab Actions

permissions:
  contents: write  # dibutuhin biar step terakhir bisa commit & push seen_posts.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python forum_notifier.py
        env:
          SCELE_USERNAME: ${{ secrets.SCELE_USERNAME }}
          SCELE_PASSWORD: ${{ secrets.SCELE_PASSWORD }}
          SCELE_FORUM_URLS: ${{ secrets.SCELE_FORUM_URLS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Simpen seen_posts.json biar gak notif ulang
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_posts.json
          git diff --staged --quiet || git commit -m "Update seen posts"
          git push
